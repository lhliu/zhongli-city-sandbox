# Cloudflare Pages 專案設定（GitHub 自動部署）
# 部署憑證不放在 repo 或容器內；綁定由 Pages 讀取此檔。
name = "zhongli-city-sandbox"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "zhongli-sandbox"
database_id = "55d6b876-8a91-45e3-8bf0-5e18d0113c19"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "zhongli-sandbox-assets"

# Cloudflare Access：ACCESS_TEAM_DOMAIN、ACCESS_AUD 在 Pages 後台以 Secret 設定
# （wrangler.toml 存在時，Pages 後台的一般變數無法編輯，但 Secret 可以）。
# 未設定時正式環境 API 一律拒絕（fail closed）。
